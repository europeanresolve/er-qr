[project]
name = "er-qr"
version = "1.1.0"
description = "QR codes in the European Resolve brand"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qrcode>=8.0",
    "pillow>=10.1",
    # Checks that every generated PNG actually scans.
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[tool.uv]
# A script folder, not a library: uv only manages the environment.
package = false
