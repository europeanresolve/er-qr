# European Resolve QR codes - settings
# Edit this file, then run:  python er_qr.py
# Paths are relative to this file.

# Look --------------------------------------------------------------------
theme      = "all"        # formal | activation | digital | all
formats    = ["png", "svg"]  # png for screens and documents, svg for print and banners
size       = 1500            # PNG width in pixels (1500 px is about 12.7 cm at 300 dpi)

# Logo --------------------------------------------------------------------
logo       = "logo.png"      # set to "" for no logo
logo_mode  = "auto"          # auto | badge | mark | as-is
                             #   badge: dark tile with amber chevrons
                             #   mark:  chevrons alone in Resolve Black
                             #   auto:  badge on formal/digital, mark on activation
logo_size  = 0.22            # share of the code width, max 0.30

# Text --------------------------------------------------------------------
# Defaults used when a code below doesn't set its own. Leave "" for none.
# Text --------------------------------------------------------------------
captions   = "off"           # on   = codes with their caption text
                             # off  = codes only, no text (captions below are kept but ignored)
                             # both = each code twice: with text, and a "_plain" version without

caption    = ""              # bold line under the code
subcaption = ""              # smaller second line, e.g. a short URL people can type
font         = ""            # optional: path to Inter-Bold.ttf (PNG only; SVG uses installed fonts)
font_regular = ""            # optional: path to Inter-Regular.ttf

out = "qr_out"               # output folder

# Codes -------------------------------------------------------------------
# One [[codes]] block per QR code. name is used for the file name.
# Each block can also override: theme, logo_mode, caption, subcaption.

